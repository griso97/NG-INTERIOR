<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#040404">
<title>NG Interior</title>
<style>
  /* INGRESSO DEL SITO: l'animazione d'apertura (js/ng-intro.js) copre lo schermo; quando finisce
     (o con un tocco) si entra nel sito: la scelta del lavoro (scegli.html). */
  html, body { margin: 0; height: 100%; background: #040404; color-scheme: dark; }
  noscript a { display: block; margin: 40vh auto 0; width: max-content; color: #e2bd5c; font: 14px/1 system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
</style>
</head>
<body>
<script type="module" src="js/ng-intro.js?v=20261126f"></script>
<script type="module">
  // Finita l'animazione (o saltata con un tocco) si entra nel sito. Se l'animazione non parte
  // (niente 3D sul dispositivo, «riduci movimento», logo che non si carica) si entra subito.
  const entra = () => location.replace('./scegli.html');
  if (!document.getElementById('ng-intro')) entra();
  else new MutationObserver((_, oss) => { if (!document.getElementById('ng-intro')) { oss.disconnect(); entra(); } })
    .observe(document.body, { childList: true });
</script>
<noscript><a href="./scegli.html">Entra</a></noscript>
</body>
</html>
