<title>NG Interior</title>
<style>
  /* Layout: scena scura unica a tutta pagina. Il logo (immagine reale) è
     campionato in particelle d'oro; scrollando si disperde e si ricompone
     nella frase "Diseña la casa de tus sueños". */
  :root{
    --ink:#0a0a0b;
    --ink-2:#131212;
    --gold-1:#f6e2a0;
    --gold-2:#e8c25a;
    --gold-3:#c8971f;
    --muted:#8a8470;
    --font-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --font-ui:"Jost", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html,body{height:100%;}
  /* L'intro è una schermata fissa a tutto schermo; l'animazione è a trigger. */
  #track{height:100%;}
  #stage{height:100%;}
  body{
    margin:0;background:var(--ink);color:var(--gold-2);
    font-family:var(--font-ui);-webkit-font-smoothing:antialiased;
    overflow-x:hidden;color-scheme:dark;
  }
  #track{position:relative;}
  #stage{
    position:relative;height:100%;width:100%;overflow:hidden;
    background:radial-gradient(130% 100% at 50% 20%, var(--ink-2) 0%, var(--ink) 62%);
  }
  canvas{display:block;width:100%;height:100%;}
  /* Frase finale: vero testo HTML, nitidissimo. Opacità guidata dallo scroll. */
  /* Blocco sotto la frase: descrizione + CTA, appare INSIEME alla frase
     (stessa opacity guidata dallo scroll). Così in una sola scrollata si
     vede la frase e il bottone "Progetta". */
  #cta-block{
    position:absolute;top:63%;left:0;right:0;
    text-align:center;opacity:0;pointer-events:none;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  #cta-block p{
    max-width:34rem;margin:0 auto 24px;color:var(--muted);
    font-weight:300;line-height:1.7;font-size:15px;
  }
  #cta-block .cta{
    display:inline-block;pointer-events:auto;
    font-weight:400;letter-spacing:.18em;text-transform:uppercase;font-size:12px;
    color:var(--ink);text-decoration:none;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
    padding:14px 36px;border-radius:2px;
    transition:transform .15s,box-shadow .15s;
  }
  #cta-block .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px -10px rgba(232,194,90,.5);
  }
  @media (max-width:640px){
    #cta-block{top:66%;}
    #cta-block p{font-size:13px;line-height:1.5;margin-bottom:18px;}
  }
  #phrase{
    position:absolute;top:42%;left:0;right:0;transform:translateY(-50%);
    margin:0;text-align:center;pointer-events:none;opacity:0;
    font-family:var(--font-display);font-weight:500;line-height:1.18;
    font-size:clamp(34px,8.5vw,72px);letter-spacing:.005em;
    background:linear-gradient(180deg,#f8e6a6 0%,#e8c25a 52%,#c8971f 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  #hint{
    position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));
    text-align:center;color:var(--muted);font-weight:300;
    letter-spacing:.3em;text-transform:uppercase;font-size:11px;
    transition:opacity .5s ease;pointer-events:none;
  }
  #hint .chev{display:block;margin:12px auto 0;width:15px;height:15px;
    border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
    transform:rotate(45deg);animation:bob 1.8s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.5}
    50%{transform:rotate(45deg) translate(3px,3px);opacity:1}}
  @media (prefers-reduced-motion: reduce){#hint .chev{animation:none}}
  #sound{
    position:absolute;top:calc(14px + env(safe-area-inset-top,0px));
    right:calc(16px + env(safe-area-inset-right,0px));
    width:40px;height:40px;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid rgba(200,151,31,.35);
    color:var(--gold-2);font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;z-index:5;
    transition:background .2s;
  }
  #sound:hover{background:rgba(200,151,31,.14);}
  #below{
    position:relative;z-index:2;background:var(--ink);padding-block:76px 100px;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    text-align:center;border-top:1px solid rgba(200,151,31,.14);
  }
  #below h2{font-family:var(--font-display);font-weight:500;
    font-size:clamp(28px,7vw,44px);color:var(--gold-1);margin:0 0 14px;
    text-wrap:balance;letter-spacing:.01em;}
  #below p{max-width:34rem;margin:0 auto;color:var(--muted);
    font-weight:300;line-height:1.8;font-size:16px;}
  #below .cta{display:inline-block;margin-top:30px;font-weight:400;
    letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--ink);
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
    padding:14px 30px;border-radius:2px;text-decoration:none;}
</style>

<script>
(function(){
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var hint=document.getElementById('hint'), track=document.getElementById('track');
  var phraseEl=document.getElementById('phrase');

  /* --- SUONO (dichiarato in cima così è pronto al primo gesto) --- */
  var audio={ctx:null,gain:null,enabled:true,ready:false};
  var btn=document.getElementById('sound');
  var sonOn=document.getElementById('son-on'), sonOff=document.getElementById('son-off');
  function kickAudio(){                 // sblocca l'audio nel contesto del gesto
    if(!audio.enabled) return;
    if(!audio.ctx) buildAudio();
    if(audio.ctx && audio.ctx.state!=='running'){ audio.ctx.resume(); }
  }
  var DPR=Math.min(window.devicePixelRatio||1,2), W=0,H=0;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var particles=[], logoTargets=[], wordTargets=[], started=false;
  var logoImg=new Image();
  logoImg.src=document.getElementById('logo-data').textContent.trim();

  function size(){
    W=canvas.clientWidth;H=canvas.clientHeight;
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  // Campiona i pixel opachi di un'immagine disegnata centrata -> punti
  function sampleImage(img, maxW, maxH, offY, gap, colorFromImg){
    var iw=img.naturalWidth, ih=img.naturalHeight;
    var sc=Math.min(maxW/iw, maxH/ih);
    var dw=iw*sc, dh=ih*sc;
    var off=document.createElement('canvas');
    off.width=Math.floor(W); off.height=Math.floor(H);
    var octx=off.getContext('2d');
    var dx=(W-dw)/2, dy=(H-dh)/2 + (offY||0);
    octx.drawImage(img, dx, dy, dw, dh);
    var data=octx.getImageData(0,0,off.width,off.height).data;
    var pts=[];
    for(var y=0;y<off.height;y+=gap){
      for(var x=0;x<off.width;x+=gap){
        var i=(y*off.width+x)*4;
        if(data[i+3]>110){
          var c=null;
          if(colorFromImg){
            c='rgb('+data[i]+','+data[i+1]+','+data[i+2]+')';
          }
          pts.push({x:x,y:y,c:c});
        }
      }
    }
    return pts;
  }

  // Campiona testo (per la frase) -> punti dorati. Salva anche il canvas per
  // poter disegnare la frase PIENA e nitida a fine scroll.
  var GOLD=['#f6e2a0','#eecb6f','#e8c25a','#d9ac3e','#c8971f'];
  var wordCanvas=null;
  function sampleText(lines, lineHeight, gap, offY){
    // Canvas ad ALTA risoluzione (x DPR) così la frase piena è nitida, non sfuocata.
    var off=document.createElement('canvas');
    off.width=Math.floor(W*DPR);off.height=Math.floor(H*DPR);
    var octx=off.getContext('2d');
    octx.scale(DPR,DPR);                 // disegno in coordinate CSS, pixel reali x DPR
    var cx=W/2, totalH=lines.length*lineHeight;
    var startY=H/2-totalH/2+lineHeight/2+(offY||0);
    var grad=octx.createLinearGradient(0,startY-lineHeight,0,startY+totalH);
    grad.addColorStop(0,'#f8e6a6');grad.addColorStop(.5,'#e8c25a');grad.addColorStop(1,'#c8971f');
    octx.fillStyle=grad;octx.textAlign='center';octx.textBaseline='middle';
    lines.forEach(function(ln,i){octx.font=ln.font;octx.fillText(ln.text,cx,startY+i*lineHeight);});
    wordCanvas=off;                      // disegnato poi con drawImage(...,0,0,W,H)
    // campiono in coordinate CSS leggendo i pixel reali (x DPR)
    var data=octx.getImageData(0,0,off.width,off.height).data, pts=[];
    var step=Math.max(1,Math.round(gap*DPR));
    for(var py=0;py<off.height;py+=step){
      for(var px=0;px<off.width;px+=step){
        var i=(py*off.width+px)*4+3;
        if(data[i]>90) pts.push({x:px/DPR,y:py/DPR,c:GOLD[(Math.random()*GOLD.length)|0]});
      }
    }
    return pts;
  }

  // Rettangolo dove viene disegnato il logo pieno (per la fase "fermo")
  var logoRect=null;
  function buildTargets(){
    var small=W<560, gap=small?4:3;   // via di mezzo: ricca ma fluida (fillRect, non arc)
    // LOGO reale: campiona l'immagine, tenendo il suo colore oro
    var r=sampleImageRect(logoImg, W*(small?0.82:0.56), H*0.5, -H*0.04);
    logoRect=r.rect;
    logoTargets=r.pts.length?r.pts:[{x:W/2,y:H/2,c:'#e8c25a'}];
    // ricampiona a densità scelta
    logoTargets=sampleImage(logoImg, W*(small?0.82:0.56), H*0.5, -H*0.04, gap, true);
    // FRASE: stesso spirito serif del logo, due righe
    var wSize=small?Math.min(W*0.1,42):60;
    wordTargets=sampleText([
      {text:'Diseña la casa', font:'500 '+wSize+'px "Cormorant Garamond", Georgia, serif'},
      {text:'de tus sueños',  font:'500 '+wSize+'px "Cormorant Garamond", Georgia, serif'}
    ], wSize*1.2, gap, 0);
  }
  // Ritorna il rettangolo di disegno del logo (per disegnarlo pieno)
  function sampleImageRect(img, maxW, maxH, offY){
    var iw=img.naturalWidth||1, ih=img.naturalHeight||1;
    var sc=Math.min(maxW/iw, maxH/ih);
    var dw=iw*sc, dh=ih*sc;
    return {rect:{dx:(W-dw)/2, dy:(H-dh)/2+(offY||0), dw:dw, dh:dh}, pts:[]};
  }

  function initParticles(){
    var n=Math.max(logoTargets.length, wordTargets.length);
    particles=[];
    for(var i=0;i<n;i++){
      var lt=logoTargets[i%logoTargets.length];
      var wt=wordTargets[i%wordTargets.length];
      particles.push({
        x:lt.x,y:lt.y, lx:lt.x,ly:lt.y, wx:wt.x,wy:wt.y,
        lc:lt.c||'#e8c25a', wc:wt.c,
        dx:(Math.random()-0.5), dy:(Math.random()-0.5),
        spin:Math.random()*6.283, r:0.4+Math.random()*0.6,
        sz:1.2+Math.random()*1.2, extra:false
      });
    }
    // Granelli EXTRA: partono da un punto del logo ma hanno una loro meta sulla
    // frase; sono invisibili da fermo e appaiono solo nella dispersione, così
    // la nuvola di sabbia è molto più ricca senza sporcare logo e frase nitidi.
    var extraCount=Math.floor(n*0.8);
    for(var k=0;k<extraCount;k++){
      var lt2=logoTargets[(Math.random()*logoTargets.length)|0];
      var wt2=wordTargets[(Math.random()*wordTargets.length)|0];
      particles.push({
        x:lt2.x,y:lt2.y, lx:lt2.x,ly:lt2.y, wx:wt2.x,wy:wt2.y,
        lc:lt2.c||'#e8c25a', wc:wt2.c,
        dx:(Math.random()-0.5), dy:(Math.random()-0.5),
        spin:Math.random()*6.283, r:0.3+Math.random()*0.7,
        sz:1.0+Math.random()*1.0, extra:true
      });
    }
  }

  function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  // target = 0 (logo) oppure 1 (frase). progress ci arriva da solo: l'animazione
  // va SEMPRE fino in fondo, non si può bloccare a metà.
  var progress=0, target=0;
  var SPEED=0.045;                 // velocità dell'animazione (più alto = più veloce)

  function setTarget(t){
    t=Math.max(0,Math.min(1,t));
    if(t===target) return;
    target=t;
    if(hint) hint.style.opacity = target>0 ? '0':'1';
    resumeAudioSafe();
  }
  function resumeAudioSafe(){ try{ kickAudio(); }catch(e){} }

  // Un gesto di scroll = trigger su/giù. Blocca lo scroll nativo finché siamo
  // nell'intro, così la pagina non "scorre" a metà.
  // Un gesto di trackpad genera una RAFFICA di eventi wheel con deltaY piccolo.
  // Dopo aver fatto partire un trigger, ignoro la raffica per un po', così un
  // solo gesto del pad = una sola animazione completa.
  var lastGesture=0;
  function gesture(dir){
    var now=Date.now();
    if(now-lastGesture<650) return;   // copre la durata della raffica del pad
    lastGesture=now;
    setTarget(dir>0 ? 1 : 0);
  }
  window.addEventListener('wheel', function(e){
    kickAudio();   // sblocca il suono al primo scroll, nel contesto del gesto
    // se la frase è formata e si scrolla ancora giù, lascia scorrere alla sezione sotto
    if(target===1 && progress>0.97 && e.deltaY>0){ return; }
    if(target===0 && progress<0.03 && e.deltaY<0){ return; }
    e.preventDefault();
    if(Math.abs(e.deltaY)<2) return;  // ignora micro-rumore del pad
    gesture(e.deltaY>0?1:-1);
  }, {passive:false});

  // touch (mobile): swipe su/giù
  var touchY=null;
  window.addEventListener('touchstart', function(e){ touchY=e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if(touchY==null) return;
    var dy=touchY-e.touches[0].clientY;   // >0 = swipe verso l'alto = vai avanti
    if(Math.abs(dy)<24) return;
    if(target===1 && progress>0.97 && dy>0){ return; }
    if(target===0 && progress<0.03 && dy<0){ return; }
    e.preventDefault();
    gesture(dy>0?1:-1);
    touchY=e.touches[0].clientY;
  }, {passive:false});

  // tastiera: frecce / spazio
  window.addEventListener('keydown', function(e){
    if(['ArrowDown','PageDown',' '].indexOf(e.key)>=0){ gesture(1); }
    else if(['ArrowUp','PageUp'].indexOf(e.key)>=0){ gesture(-1); }
  });

  function draw(){
    progress+=(target-progress)*SPEED*2.2;
    if(Math.abs(target-progress)<0.0015) progress=target;
    var p=progress;
    ctx.clearRect(0,0,W,H);

    // Tre fasi:
    //  p in [0 .. FADE]        logo PIENO nitido -> si sgretola in polvere
    //  p in [FADE .. 1-FADE]   solo polvere (sabbia fine che vola)
    //  p in [1-FADE .. 1]      la polvere si ricompone -> FRASE PIENA nitida
    var FADE=0.10;
    var logoAlpha = p<=0 ? 1 : (p>=FADE ? 0 : 1-(p/FADE));
    var wordAlpha = p<=1-FADE ? 0 : (p>=1 ? 1 : (p-(1-FADE))/FADE);
    var partAlpha = Math.max(0, 1 - logoAlpha - wordAlpha);

    // LOGO pieno (inizio)
    if(logoAlpha>0.01 && logoRect && logoImg.naturalWidth>0){
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=logoAlpha;
      ctx.drawImage(logoImg, logoRect.dx, logoRect.dy, logoRect.dw, logoRect.dh);
    }

    // POLVERE (sempre calcolata, così anche sotto il fade è coerente)
    if(partAlpha>0.005){
      ctx.globalCompositeOperation='lighter';
      var scatter=Math.sin(Math.min(p,1)*Math.PI);     // nuvola max a metà
      var tMove=easeInOut(Math.min(p,1));
      var amp=scatter*(reduce?22:175);
      var extraVis=Math.min(1, scatter*1.6);
      // Ottimizzazione: un solo globalAlpha per frame (non per particella) e
      // fillRect invece di arc -> molto più veloce con tante particelle.
      var aBase=(0.5+(1-scatter)*0.5)*partAlpha;
      ctx.globalAlpha=aBase;
      var useWord = tMove>=0.5;
      for(var i=0;i<particles.length;i++){
        var pt=particles[i];
        if(pt.extra && extraVis<0.02) continue;   // extra invisibili da nitido: salta
        var bx=pt.lx+(pt.wx-pt.lx)*tMove;
        var by=pt.ly+(pt.wy-pt.ly)*tMove;
        var ea=pt.extra?1.5:1;
        var ang=pt.spin+p*6;
        var ox=pt.dx*amp*ea+Math.cos(ang)*amp*0.45*ea;
        var oy=pt.dy*amp*ea+Math.sin(ang)*amp*0.45*ea;
        pt.x+=((bx+ox)-pt.x)*0.2;
        pt.y+=((by+oy)-pt.y)*0.2;
        ctx.fillStyle = useWord ? pt.wc : pt.lc;
        var s=pt.sz;
        ctx.fillRect(pt.x, pt.y, s, s);
      }
      // gli extra, quando semi-visibili, con un velo sopra per la trasparenza morbida
      if(extraVis<1){
        // nessuna seconda passata: aBase già regola l'insieme; gli extra
        // emergono gradualmente perché calcolati solo quando scatter è alto
      }
    } else {
      for(var j=0;j<particles.length;j++){particles[j].x=particles[j].lx;particles[j].y=particles[j].ly;}
    }

    // FRASE piena nitida: vero testo HTML, opacità guidata dallo scroll
    if(phraseEl) phraseEl.style.opacity = wordAlpha.toFixed(3);
    // Blocco descrizione + CTA: stessa opacità della frase, così tutto
    // appare INSIEME in una sola scrollata
    var ctaEl = document.getElementById('cta-block');
    if(ctaEl) ctaEl.style.opacity = wordAlpha.toFixed(3);

    // suono: volume = intensità della dispersione della sabbia
    if(window.__setAudioLevel) window.__setAudioLevel(Math.sin(Math.min(p,1)*Math.PI));

    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    requestAnimationFrame(draw);
  }

  function rebuild(){
    size();buildTargets();
    if(particles.length && particles.length===Math.max(logoTargets.length,wordTargets.length)){
      for(var i=0;i<particles.length;i++){
        var lt=logoTargets[i%logoTargets.length], wt=wordTargets[i%wordTargets.length];
        particles[i].lx=lt.x;particles[i].ly=lt.y;particles[i].lc=lt.c||'#e8c25a';
        particles[i].wx=wt.x;particles[i].wy=wt.y;particles[i].wc=wt.c;
      }
    } else initParticles();
  }

  function start(){
    if(started) return; started=true;
    rebuild();requestAnimationFrame(draw);
  }

  function whenReady(){
    var fontsOk = !document.fonts || !document.fonts.ready;
    var imgOk = logoImg.complete && logoImg.naturalWidth>0;
    if(imgOk && (fontsOk || document.fonts.status==='loaded')) start();
  }
  if(logoImg.complete) whenReady(); else logoImg.onload=function(){ if(document.fonts&&document.fonts.ready){document.fonts.ready.then(start);} else start(); };
  if(document.fonts&&document.fonts.ready){
    document.fonts.load('700 100px "Cormorant Garamond"').catch(function(){});
    document.fonts.ready.then(function(){ if(logoImg.complete && logoImg.naturalWidth>0) start(); });
  }
  logoImg.onerror=function(){ /* se il logo non carica, parte comunque con la frase */ start(); };
  setTimeout(function(){ if(!started && logoImg.naturalWidth>0) start(); else if(!started) start(); }, 1600);

  var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(rebuild,160);});

  /* --- SUONO: fruscio di sabbia (WebAudio, nessun file esterno) --- */
  function buildAudio(){
    if(audio.ctx) return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      var c=new AC();
      // Buffer di rumore (4s) condiviso dai vari strati
      var len=c.sampleRate*4, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<len;i++){ d[i]=Math.random()*2-1; }

      var master=c.createGain(); master.gain.value=0; master.connect(c.destination);

      // STRATO 1 — corpo del fruscio (sabbia che scorre): rumore filtrato medio
      var s1=c.createBufferSource(); s1.buffer=buf; s1.loop=true;
      var f1=c.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value=2200; f1.Q.value=0.5;
      var g1=c.createGain(); g1.gain.value=0.55;
      s1.connect(f1); f1.connect(g1); g1.connect(master); s1.start();

      // STRATO 2 — granuli acuti (i singoli granelli): acuto e leggero
      var s2=c.createBufferSource(); s2.buffer=buf; s2.loop=true; s2.playbackRate.value=1.4;
      var f2=c.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=5000;
      var g2=c.createGain(); g2.gain.value=0.28;
      s2.connect(f2); f2.connect(g2); g2.connect(master); s2.start();

      // STRATO 3 — soffio grave (polvere/vento): grave e ovattato
      var s3=c.createBufferSource(); s3.buffer=buf; s3.loop=true; s3.playbackRate.value=0.6;
      var f3=c.createBiquadFilter(); f3.type='lowpass'; f3.frequency.value=600;
      var g3=c.createGain(); g3.gain.value=0.5;
      s3.connect(f3); f3.connect(g3); g3.connect(master); s3.start();

      // Modulazione lenta della frequenza del filtro 1 -> suono "vivo", non statico
      var lfo=c.createOscillator(); lfo.frequency.value=0.25;
      var lfoGain=c.createGain(); lfoGain.gain.value=700;
      lfo.connect(lfoGain); lfoGain.connect(f1.frequency); lfo.start();

      audio.ctx=c; audio.gain=master; audio.ready=true;
    }catch(e){ audio.ready=false; }
  }
  function resumeAudio(){
    if(!audio.enabled) return;
    buildAudio();
    if(audio.ctx && audio.ctx.state==='suspended') audio.ctx.resume();
  }
  // il volume segue la dispersione (scatter), calcolato in draw via setAudioLevel
  window.__setAudioLevel=function(scatter){
    if(audio.ready && audio.gain && audio.enabled){
      var target=Math.max(0, scatter)*0.11;
      audio.gain.gain.setTargetAtTime(target, audio.ctx.currentTime, 0.10);
    }
  };
  // primo gesto utente -> abilita audio (wheel incluso: lo scroll nativo è bloccato)
  ['wheel','pointerdown','touchstart','keydown','click'].forEach(function(ev){
    window.addEventListener(ev, resumeAudio, {passive:true, once:false});
  });
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    audio.enabled=!audio.enabled;
    sonOn.hidden=!audio.enabled; sonOff.hidden=audio.enabled;
    if(audio.enabled){ resumeAudio(); }
    else if(audio.gain){ audio.gain.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.05); }
  });
})();
</script>

</body>
</html>
