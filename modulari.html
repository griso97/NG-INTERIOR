<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NG Interior · Mobili modulari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <!-- Tema chiaro/scuro: applicato subito per evitare lo "sfarfallio" -->
  <script>(function(){try{var t=localStorage.getItem('ng-tema')||'scuro';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <script src="js/i18n.js?v=20261115a"></script>
  <link rel="stylesheet" href="css/style.css?v=20261115a" />
  <link rel="stylesheet" href="css/cucina.css?v=20261115a" />
  <link rel="stylesheet" href="css/modulari.css?v=20261115a" />
  <!-- Three.js ES modules via importmap (file locali in vendor/) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body class="cucina-body">
  <header class="app-header">
    <div class="brand">
      <a href="./scegli.html" class="back-link" title="Torna alla scelta">←</a>
      <div>
        <div class="mono">NG INTERIOR</div>
        <div class="sottotitolo">Mobili modulari · sottoscala, nicchie, mansarde</div>
      </div>
    </div>
    <div class="header-info" id="step-info">Passo 1 — Forma del vano (vista frontale)</div>
    <div class="header-strumenti">
      <button type="button" id="tema-toggle" class="tema-toggle">☀ Chiaro</button>
    </div>
  </header>

  <nav class="stepper" id="stepper">
    <button class="step" data-step="1" type="button">
      <span class="step-n">1</span><span class="step-nome">Forma del vano</span>
    </button>
    <button class="step" data-step="2" type="button">
      <span class="step-n">2</span><span class="step-nome">Moduli</span>
    </button>
    <button class="step" data-step="3" type="button">
      <span class="step-n">3</span><span class="step-nome">Rendering 3D</span>
    </button>
    <button class="step" data-step="4" type="button">
      <span class="step-n">4</span><span class="step-nome">Distinta</span>
    </button>
  </nav>

  <main class="cucina-app">
    <aside id="mod-pannello" class="pannello"></aside>
    <section class="cucina-vista">
      <div class="vista-strumenti">
        <span class="legenda">Vista frontale · griglia 100 mm · misure in mm</span>
        <span class="storia-azioni">
          <button id="btn-annulla" type="button" class="btn-storia" title="Annulla (Ctrl+Z)" disabled>↶ Annulla</button>
          <button id="btn-rifai" type="button" class="btn-storia" title="Rifai (Ctrl+Y)" disabled>Rifai ↷</button>
        </span>
      </div>
      <svg id="mod-svg" class="mod-svg" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
      <canvas id="mod-3d" class="mod-3d" hidden></canvas>
    </section>
    <aside id="mod-riepilogo" class="riepilogo-panel"></aside>
  </main>

  <!-- Distinta di taglio -->
  <div id="distinta-overlay" class="modale-fondo" hidden>
    <div class="distinta-box" role="dialog" aria-modal="true" aria-labelledby="distinta-titolo">
      <div class="distinta-head">
        <h3 id="distinta-titolo">Distinta di taglio</h3>
        <div class="distinta-azioni">
          <button id="distinta-xlsx" class="btn-oro" type="button">Esporta Excel</button>
          <button id="distinta-modello" class="btn-ghost" type="button">⚙ Modello Excel</button>
          <button id="distinta-chiudi" class="btn-ghost" type="button">Chiudi</button>
        </div>
      </div>
      <div id="distinta-corpo" class="distinta-corpo"></div>
    </div>
  </div>

  <script type="module" src="js/modulari/main.js?v=20261115a"></script>
</body>
</html>
