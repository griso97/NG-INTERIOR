<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NG Interior · Progetta cucina</title>
  <meta name="build" content="2026-11-05c" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cucina.css" />

  <!-- Three.js ES modules via importmap (file locali in vendor/) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body class="cucina-body">
  <header class="app-header">
    <div class="brand">
      <a href="./scegli.html" class="back-link" title="Torna alla scelta">←</a>
      <div>
        <div class="mono">NG INTERIOR</div>
        <div class="sottotitolo">Progettazione cucina</div>
      </div>
    </div>
    <div class="header-info" id="step-info">Passo 1 di 4 — Pianta: perimetro</div>
    <div class="header-strumenti"></div>
  </header>

  <!-- Stepper in alto -->
  <nav class="stepper" id="stepper">
    <button class="step attivo" data-step="1" aria-current="step">
      <span class="step-n">1</span>
      <span class="step-nome">Pianta</span>
    </button>
    <button class="step disabilitato" data-step="2" disabled>
      <span class="step-n">2</span>
      <span class="step-nome">Moduli bassi</span>
    </button>
    <button class="step disabilitato" data-step="3" disabled>
      <span class="step-n">3</span>
      <span class="step-nome">Moduli alti</span>
    </button>
    <button class="step disabilitato" data-step="4" disabled>
      <span class="step-n">4</span>
      <span class="step-nome">Rendering 3D</span>
    </button>
  </nav>

  <main class="cucina-app">
    <!-- Pannello parametri -->
    <aside id="cucina-pannello" class="pannello"></aside>

    <!-- Area disegno 2D (SVG in scala) -->
    <section class="cucina-vista">
      <div class="vista-strumenti">
        <span class="legenda">Griglia 100 mm · tutte le misure in mm</span>
        <span class="storia-azioni">
          <button id="btn-annulla" type="button" class="btn-storia" title="Annulla" disabled>↶ Annulla</button>
          <button id="btn-rifai" type="button" class="btn-storia" title="Rifai" disabled>Rifai ↷</button>
        </span>
      </div>
      <svg id="pianta-svg" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- Vista 3D (solo Step 3) -->
      <canvas id="cucina-3d" hidden></canvas>
      <!-- Mobili da piazzare sulla pianta (solo Step 2): tocca, scegli la misura, trascina -->
      <div id="palette" class="palette" hidden></div>
    </section>

    <!-- Pannello riepilogo -->
    <aside id="cucina-riepilogo" class="riepilogo-panel"></aside>
  </main>

  <!-- Finestra scelta misura -->
  <div id="modale" class="modale-fondo" hidden>
    <div class="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titolo">
      <h3 id="modale-titolo"></h3>
      <div id="modale-opzioni" class="modale-opzioni"></div>
      <button id="modale-annulla" class="btn-ghost" type="button" style="width:100%">Annulla</button>
    </div>
  </div>

  <script type="module" src="js/cucina/main.js"></script>
</body>
</html>
